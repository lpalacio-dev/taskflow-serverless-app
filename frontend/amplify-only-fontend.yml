version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        # Usamos el flag --prefer-offline para aprovechar al máximo el caché
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      # Cacheamos la carpeta de npm para instalaciones ultra rápidas en el siguiente build
      - frontend/.npm/**/*
      - frontend/node_modules/**/*