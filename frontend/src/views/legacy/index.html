<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Variables ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0a0f;
      --surface:  #12121a;
      --border:   #1e1e2e;
      --accent:   #00e5c0;
      --accent2:  #ff4d6d;
      --warn:     #ffd166;
      --text:     #e2e2f0;
      --muted:    #5a5a7a;
      --radius:   4px;
      --mono:     'Space Mono', monospace;
      --sans:     'Syne', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Grid noise texture ─────────────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(0,229,192,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,192,.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* ── Auth Screen ────────────────────────────────────────────────────── */
    #auth-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; position: relative; z-index: 1;
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 2px solid var(--accent);
      padding: 48px 40px;
      width: 100%; max-width: 420px;
      position: relative;
    }

    .auth-card::before {
      content: '';
      position: absolute; top: -2px; left: 32px;
      width: 60px; height: 2px;
      background: var(--accent2);
    }

    .brand {
      font-size: 28px; font-weight: 800; letter-spacing: -1px;
      margin-bottom: 8px;
    }
    .brand span { color: var(--accent); }

    .auth-sub {
      font-family: var(--mono); font-size: 11px;
      color: var(--muted); letter-spacing: 2px; text-transform: uppercase;
      margin-bottom: 36px;
    }

    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-family: var(--mono); font-size: 11px;
      color: var(--muted); letter-spacing: 1px; text-transform: uppercase;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%; background: var(--bg);
      border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); font-family: var(--mono); font-size: 14px;
      padding: 10px 14px; outline: none;
      transition: border-color .15s;
    }
    .field input:focus { border-color: var(--accent); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-family: var(--mono); font-size: 13px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      padding: 12px 24px; border: none; border-radius: var(--radius);
      cursor: pointer; transition: all .15s; width: 100%;
    }
    .btn-primary {
      background: var(--accent); color: #000;
    }
    .btn-primary:hover { background: #00ffda; transform: translateY(-1px); }
    .btn-ghost {
      background: transparent; color: var(--muted);
      border: 1px solid var(--border); width: auto;
      margin-top: 12px;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    .auth-toggle {
      text-align: center; margin-top: 20px;
      font-family: var(--mono); font-size: 12px; color: var(--muted);
    }
    .auth-toggle a {
      color: var(--accent); cursor: pointer; text-decoration: none;
    }
    .auth-toggle a:hover { text-decoration: underline; }

    .error-msg {
      background: rgba(255,77,109,.1); border: 1px solid rgba(255,77,109,.3);
      color: var(--accent2); font-family: var(--mono); font-size: 12px;
      padding: 10px 14px; border-radius: var(--radius); margin-bottom: 16px;
    }

    /* ── App Layout ─────────────────────────────────────────────────────── */
    #app { display: none; min-height: 100vh; position: relative; z-index: 1; }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px; height: 56px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }

    .topbar-brand { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
    .topbar-brand span { color: var(--accent); }

    .ws-status {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--mono); font-size: 11px; color: var(--muted);
    }
    .ws-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted); transition: background .3s;
    }
    .ws-dot.connected { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .user-chip {
      font-family: var(--mono); font-size: 11px; color: var(--muted);
      border: 1px solid var(--border); padding: 4px 12px; border-radius: 20px;
    }
    .logout-btn {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-family: var(--mono); font-size: 11px;
      letter-spacing: 1px; text-transform: uppercase;
      transition: color .15s;
    }
    .logout-btn:hover { color: var(--accent2); }

    .main { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 56px); }

    /* ── Sidebar ────────────────────────────────────────────────────────── */
    .sidebar {
      background: var(--surface); border-right: 1px solid var(--border);
      padding: 24px 0; display: flex; flex-direction: column;
    }

    .sidebar-section { padding: 0 20px; margin-bottom: 8px; }
    .sidebar-label {
      font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
      text-transform: uppercase; color: var(--muted);
      padding: 0 8px; margin-bottom: 8px;
    }

    .project-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: var(--radius);
      cursor: pointer; font-size: 14px; font-weight: 600;
      color: var(--muted); transition: all .15s;
    }
    .project-item:hover { background: var(--border); color: var(--text); }
    .project-item.active {
      background: rgba(0,229,192,.08);
      color: var(--accent); border-left: 2px solid var(--accent);
    }
    .project-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }

    .add-project-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 20px; font-family: var(--mono); font-size: 12px;
      color: var(--muted); cursor: pointer; border: none; background: none;
      width: 100%; text-align: left; transition: color .15s;
    }
    .add-project-btn:hover { color: var(--accent); }

    /* ── Task Board ─────────────────────────────────────────────────────── */
    .board { padding: 32px; overflow-y: auto; }

    .board-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px;
    }
    .board-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
    .board-title span { color: var(--accent); }

    .new-task-btn {
      display: flex; align-items: center; gap: 8px;
      background: var(--accent); color: #000;
      font-family: var(--mono); font-size: 12px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      padding: 10px 20px; border: none; border-radius: var(--radius);
      cursor: pointer; transition: all .15s;
    }
    .new-task-btn:hover { background: #00ffda; transform: translateY(-1px); }

    /* ── Columns ────────────────────────────────────────────────────────── */
    .columns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

    .column { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }

    .col-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid var(--border);
    }
    .col-title {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
    }
    .col-indicator { width: 6px; height: 6px; border-radius: 50%; }
    .col-indicator.pending    { background: var(--muted); }
    .col-indicator.inprogress { background: var(--warn); }
    .col-indicator.done       { background: var(--accent); }

    .col-count {
      font-family: var(--mono); font-size: 11px;
      background: var(--border); color: var(--muted);
      padding: 2px 8px; border-radius: 10px;
    }

    .col-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 120px; }

    /* ── Task Card ──────────────────────────────────────────────────────── */
    .task-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px;
      cursor: pointer; transition: all .15s;
      animation: cardIn .2s ease;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .task-card:hover { border-color: var(--accent); transform: translateY(-1px); }

    .task-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }

    .task-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .priority-badge {
      font-family: var(--mono); font-size: 10px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      padding: 2px 8px; border-radius: 2px;
    }
    .priority-badge.HIGH   { background: rgba(255,77,109,.15); color: var(--accent2); }
    .priority-badge.MEDIUM { background: rgba(255,209,102,.15); color: var(--warn); }
    .priority-badge.LOW    { background: rgba(0,229,192,.1); color: var(--accent); }

    .task-project {
      font-family: var(--mono); font-size: 10px; color: var(--muted);
    }

    .task-actions { display: flex; gap: 6px; margin-top: 10px; }
    .task-btn {
      font-family: var(--mono); font-size: 10px; letter-spacing: 1px;
      text-transform: uppercase; padding: 4px 10px;
      border: 1px solid var(--border); background: none;
      color: var(--muted); border-radius: var(--radius);
      cursor: pointer; transition: all .15s;
    }
    .task-btn:hover { border-color: var(--accent); color: var(--accent); }
    .task-btn.del:hover { border-color: var(--accent2); color: var(--accent2); }

    /* ── Modal ──────────────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.7);
      display: none; align-items: center; justify-content: center;
      z-index: 100; padding: 20px;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-top: 2px solid var(--accent);
      width: 100%; max-width: 480px; padding: 32px;
      animation: modalIn .2s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(.97); }
      to   { opacity: 1; transform: scale(1); }
    }
    .modal-title {
      font-size: 18px; font-weight: 800; letter-spacing: -0.5px;
      margin-bottom: 24px;
    }
    .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
    .btn-sm { padding: 10px 20px; font-size: 12px; width: auto; }

    .select-field {
      width: 100%; background: var(--bg);
      border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); font-family: var(--mono); font-size: 14px;
      padding: 10px 14px; outline: none; transition: border-color .15s;
      appearance: none;
    }
    .select-field:focus { border-color: var(--accent); }

    /* ── Live feed ──────────────────────────────────────────────────────── */
    .live-feed {
      position: fixed; bottom: 24px; right: 24px;
      width: 320px; z-index: 50;
      display: flex; flex-direction: column; gap: 8px;
    }
    .feed-item {
      background: var(--surface); border: 1px solid var(--accent);
      border-radius: var(--radius); padding: 12px 16px;
      font-family: var(--mono); font-size: 11px; color: var(--text);
      animation: feedIn .25s ease;
    }
    @keyframes feedIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .feed-item .feed-type {
      color: var(--accent); font-weight: 700; margin-bottom: 2px;
    }
    .feed-item.del { border-color: var(--accent2); }
    .feed-item.del .feed-type { color: var(--accent2); }

    .empty-col {
      font-family: var(--mono); font-size: 11px; color: var(--muted);
      text-align: center; padding: 20px 0;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<!-- ══ AUTH SCREEN ══════════════════════════════════════════════════════════ -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="brand">Task<span>Flow</span></div>
    <div class="auth-sub">AWS Serverless · Real-time</div>

    <div id="error-box" class="error-msg" style="display:none"></div>

    <!-- Login -->
    <div id="login-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="tu@email.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-pass" placeholder="••••••••" />
      </div>
      <button class="btn btn-primary" onclick="doLogin()">Iniciar sesión</button>
      <div class="auth-toggle">
        ¿No tienes cuenta? <a onclick="toggleAuth('register')">Regístrate</a>
      </div>
    </div>

    <!-- Register -->
    <div id="register-form" style="display:none">
      <div class="field">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="tu@email.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="reg-pass" placeholder="Mín. 8 caracteres" />
      </div>
      <button class="btn btn-primary" onclick="doRegister()">Crear cuenta</button>
      <div class="auth-toggle">
        ¿Ya tienes cuenta? <a onclick="toggleAuth('login')">Inicia sesión</a>
      </div>
    </div>

    <!-- Confirm -->
    <div id="confirm-form" style="display:none">
      <p style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:20px">
        Revisa tu email y pega el código de verificación.
      </p>
      <div class="field">
        <label>Código de verificación</label>
        <input type="text" id="confirm-code" placeholder="123456" />
      </div>
      <button class="btn btn-primary" onclick="doConfirm()">Verificar</button>
    </div>
  </div>
</div>

<!-- ══ APP ══════════════════════════════════════════════════════════════════ -->
<div id="app">
  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-brand">Task<span>Flow</span></div>
    <div class="ws-status">
      <div class="ws-dot" id="ws-dot"></div>
      <span id="ws-label">DISCONNECTED</span>
    </div>
    <div class="topbar-right">
      <div class="user-chip" id="user-chip"></div>
      <button class="logout-btn" onclick="doLogout()">Salir</button>
    </div>
  </div>

  <div class="main">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Proyectos</div>
        <div id="project-list"></div>
      </div>
      <button class="add-project-btn" onclick="addProject()">+ Nuevo proyecto</button>
    </div>

    <!-- Board -->
    <div class="board">
      <div class="board-header">
        <div class="board-title">
          <span id="board-project-name">Selecciona un proyecto</span>
        </div>
        <button class="new-task-btn" onclick="openNewTask()">+ Nueva tarea</button>
      </div>
      <div class="columns">
        <div class="column">
          <div class="col-header">
            <div class="col-title">
              <div class="col-indicator pending"></div> Pendiente
            </div>
            <div class="col-count" id="cnt-pending">0</div>
          </div>
          <div class="col-body" id="col-PENDING"></div>
        </div>
        <div class="column">
          <div class="col-header">
            <div class="col-title">
              <div class="col-indicator inprogress"></div> En Progreso
            </div>
            <div class="col-count" id="cnt-inprogress">0</div>
          </div>
          <div class="col-body" id="col-IN_PROGRESS"></div>
        </div>
        <div class="column">
          <div class="col-header">
            <div class="col-title">
              <div class="col-indicator done"></div> Completado
            </div>
            <div class="col-count" id="cnt-done">0</div>
          </div>
          <div class="col-body" id="col-DONE"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ══ MODAL: Nueva / Editar tarea ════════════════════════════════════════════ -->
<div class="modal-overlay" id="task-modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">Nueva Tarea</div>
    <div class="field">
      <label>Título *</label>
      <input type="text" id="t-title" placeholder="Descripción breve de la tarea" />
    </div>
    <div class="field">
      <label>Descripción</label>
      <input type="text" id="t-desc" placeholder="Detalles opcionales" />
    </div>
    <div class="field">
      <label>Estado</label>
      <select class="select-field" id="t-status">
        <option value="PENDING">Pendiente</option>
        <option value="IN_PROGRESS">En Progreso</option>
        <option value="DONE">Completado</option>
      </select>
    </div>
    <div class="field">
      <label>Prioridad</label>
      <select class="select-field" id="t-priority">
        <option value="LOW">Baja</option>
        <option value="MEDIUM">Media</option>
        <option value="HIGH">Alta</option>
      </select>
    </div>
    <input type="hidden" id="t-taskid" />
    <div class="modal-actions">
      <button class="btn btn-primary btn-sm" onclick="saveTask()">Guardar</button>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancelar</button>
    </div>
  </div>
</div>

<!-- ══ Live feed ════════════════════════════════════════════════════════════ -->
<div class="live-feed" id="live-feed"></div>

<script>
// ════════════════════════════════════════════════════════════════════════
// ⚙️  CONFIGURACIÓN — Rellena estos valores tras hacer el deploy SAM
// ════════════════════════════════════════════════════════════════════════
const CONFIG = {
  // Outputs del template.yaml (sam deploy)
  HTTP_API:   'https://XXXXXXXXXX.execute-api.us-east-1.amazonaws.com/prod',
  WS_API:     'wss://YYYYYYYYYY.execute-api.us-east-1.amazonaws.com/prod',

  // Cognito (también en Outputs del template)
  USER_POOL_ID:  'us-east-1_XXXXXXXXX',
  CLIENT_ID:     '1example23456789',
  REGION:        'us-east-1',
};

// ════════════════════════════════════════════════════════════════════════
// Estado global de la app
// ════════════════════════════════════════════════════════════════════════
let state = {
  token:          null,   // JWT de Cognito (idToken)
  userId:         null,
  email:          null,
  tasks:          [],
  currentProject: 'default',
  projects:       [
    { id: 'default', name: 'General', color: '#00e5c0' },
    { id: 'frontend', name: 'Frontend', color: '#ffd166' },
    { id: 'backend',  name: 'Backend',  color: '#ff4d6d' },
  ],
  ws:             null,
  pendingEmail:   null,   // email guardado durante registro
};

// ════════════════════════════════════════════════════════════════════════
// Cognito helpers (fetch directo a la API de Cognito sin SDK)
// ════════════════════════════════════════════════════════════════════════
const COGNITO_URL = `https://cognito-idp.${CONFIG.REGION}.amazonaws.com/`;

async function cognitoRequest(action, body) {
  const res = await fetch(COGNITO_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/x-amz-json-1.1',
      'X-Amz-Target': `AWSCognitoIdentityProviderService.${action}`,
    },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.message || data.__type || 'Auth error');
  return data;
}

async function doLogin() {
  clearError();
  try {
    const email = document.getElementById('login-email').value.trim();
    const pass  = document.getElementById('login-pass').value;
    const data  = await cognitoRequest('InitiateAuth', {
      AuthFlow: 'USER_PASSWORD_AUTH',
      ClientId: CONFIG.CLIENT_ID,
      AuthParameters: { USERNAME: email, PASSWORD: pass },
    });
    const tokens = data.AuthenticationResult;
    state.token  = tokens.IdToken;
    state.userId = parseJwt(tokens.IdToken).sub;
    state.email  = email;
    startApp();
  } catch (e) { showError(e.message); }
}

async function doRegister() {
  clearError();
  try {
    const email = document.getElementById('reg-email').value.trim();
    const pass  = document.getElementById('reg-pass').value;
    await cognitoRequest('SignUp', {
      ClientId: CONFIG.CLIENT_ID,
      Username: email,
      Password: pass,
      UserAttributes: [{ Name: 'email', Value: email }],
    });
    state.pendingEmail = email;
    toggleAuth('confirm');
  } catch (e) { showError(e.message); }
}

async function doConfirm() {
  clearError();
  try {
    const code = document.getElementById('confirm-code').value.trim();
    await cognitoRequest('ConfirmSignUp', {
      ClientId: CONFIG.CLIENT_ID,
      Username: state.pendingEmail,
      ConfirmationCode: code,
    });
    toggleAuth('login');
    showError('✓ Cuenta verificada. Inicia sesión.');
  } catch (e) { showError(e.message); }
}

function doLogout() {
  if (state.ws) state.ws.close();
  state = { ...state, token: null, userId: null, email: null, ws: null };
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
}

// ════════════════════════════════════════════════════════════════════════
// HTTP API helpers
// ════════════════════════════════════════════════════════════════════════
async function apiRequest(method, path, body) {
  const res = await fetch(`${CONFIG.HTTP_API}${path}`, {
    method,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${state.token}`,
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) throw new Error(`API error: ${res.status}`);
  return res.json();
}

async function loadTasks() {
  try {
    const tasks = await apiRequest('GET', `/tasks?projectId=${state.currentProject}`);
    state.tasks = tasks || [];
    renderBoard();
  } catch (e) { console.error('Load tasks error:', e); }
}

async function saveTask() {
  const taskId    = document.getElementById('t-taskid').value || crypto.randomUUID();
  const title     = document.getElementById('t-title').value.trim();
  const desc      = document.getElementById('t-desc').value.trim();
  const status    = document.getElementById('t-status').value;
  const priority  = document.getElementById('t-priority').value;

  if (!title) return;

  try {
    const task = await apiRequest('PUT', '/tasks', {
      taskId, title, description: desc, status, priority,
      projectId: state.currentProject,
      createdBy: state.userId,
    });
    // El WebSocket nos notificará; si no hay WS activo, actualizamos local
    if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
      upsertTaskLocal(typeof task === 'object' ? task : { taskId, title, description: desc, status, priority, projectId: state.currentProject });
      renderBoard();
    }
    closeModal();
  } catch (e) { console.error('Save task error:', e); }
}

async function deleteTask(taskId) {
  try {
    await apiRequest('DELETE', `/tasks/${taskId}`);
    if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
      state.tasks = state.tasks.filter(t => t.taskId !== taskId);
      renderBoard();
    }
  } catch (e) { console.error('Delete task error:', e); }
}

// ════════════════════════════════════════════════════════════════════════
// WebSocket
// ════════════════════════════════════════════════════════════════════════
function connectWs() {
  // Cognito token en el header de conexión WS
  const ws = new WebSocket(`${CONFIG.WS_API}`, [], {
    headers: { Authorization: `Bearer ${state.token}` }
  });
  // Nota: browsers no permiten headers en WebSocket nativo.
  // Para Cognito + WebSocket en browser, pasar el token como query param:
  //   const ws = new WebSocket(`${CONFIG.WS_API}?token=${state.token}`);
  // y ajustar el Authorizer para leerlo de queryStringParameters.
  state.ws = ws;

  ws.onopen = () => {
    document.getElementById('ws-dot').classList.add('connected');
    document.getElementById('ws-label').textContent = 'LIVE';
  };

  ws.onclose = () => {
    document.getElementById('ws-dot').classList.remove('connected');
    document.getElementById('ws-label').textContent = 'DISCONNECTED';
    // Reconexión automática cada 5s
    setTimeout(connectWs, 5000);
  };

  ws.onmessage = (evt) => {
    try {
      const msg = JSON.parse(evt.data);
      handleWsEvent(msg);
    } catch {}
  };

  ws.onerror = (e) => console.warn('WS error:', e);
}

function handleWsEvent({ eventType, task }) {
  if (!task) return;

  // Solo procesar eventos del proyecto actual
  if (task.projectId && task.projectId !== state.currentProject) return;

  if (eventType === 'TASK_UPSERTED') {
    upsertTaskLocal(task);
    pushFeedItem('UPDATED', task.title, false);
  } else if (eventType === 'TASK_DELETED') {
    state.tasks = state.tasks.filter(t => t.taskId !== task.taskId);
    pushFeedItem('DELETED', task.taskId, true);
  }
  renderBoard();
}

function pushFeedItem(type, name, isDel) {
  const feed = document.getElementById('live-feed');
  const el   = document.createElement('div');
  el.className = `feed-item${isDel ? ' del' : ''}`;
  el.innerHTML = `<div class="feed-type">⚡ ${type}</div><div>${name}</div>`;
  feed.prepend(el);
  setTimeout(() => el.remove(), 4000);
}

// ════════════════════════════════════════════════════════════════════════
// Render
// ════════════════════════════════════════════════════════════════════════
function renderBoard() {
  const cols = { PENDING: [], IN_PROGRESS: [], DONE: [] };
  state.tasks.forEach(t => {
    if (cols[t.status]) cols[t.status].push(t);
  });

  for (const [status, tasks] of Object.entries(cols)) {
    const el = document.getElementById(`col-${status}`);
    if (!el) continue;
    el.innerHTML = tasks.length === 0
      ? '<div class="empty-col">— vacío —</div>'
      : tasks.map(t => taskCardHTML(t)).join('');
  }

  document.getElementById('cnt-pending').textContent    = cols.PENDING.length;
  document.getElementById('cnt-inprogress').textContent = cols.IN_PROGRESS.length;
  document.getElementById('cnt-done').textContent       = cols.DONE.length;
}

function taskCardHTML(t) {
  const nextStatus = { PENDING: 'IN_PROGRESS', IN_PROGRESS: 'DONE', DONE: 'PENDING' };
  const nextLabel  = { PENDING: '▶ Iniciar', IN_PROGRESS: '✓ Completar', DONE: '↩ Reabrir' };
  return `
    <div class="task-card" onclick="openEditTask('${t.taskId}')">
      <div class="task-title">${escHtml(t.title)}</div>
      <div class="task-meta">
        <span class="priority-badge ${t.priority}">${t.priority}</span>
        <span class="task-project">#${t.projectId}</span>
      </div>
      <div class="task-actions" onclick="event.stopPropagation()">
        <button class="task-btn" onclick="moveTask('${t.taskId}','${nextStatus[t.status]}')">
          ${nextLabel[t.status]}
        </button>
        <button class="task-btn del" onclick="deleteTask('${t.taskId}')">✕</button>
      </div>
    </div>`;
}

async function moveTask(taskId, newStatus) {
  const task = state.tasks.find(t => t.taskId === taskId);
  if (!task) return;
  await apiRequest('PUT', '/tasks', { ...task, status: newStatus });
  if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
    task.status = newStatus;
    renderBoard();
  }
}

function renderSidebar() {
  const list = document.getElementById('project-list');
  list.innerHTML = state.projects.map(p => `
    <div class="project-item${p.id === state.currentProject ? ' active' : ''}"
         onclick="selectProject('${p.id}')">
      <div class="project-dot" style="background:${p.color}"></div>
      ${p.name}
    </div>`).join('');
  const proj = state.projects.find(p => p.id === state.currentProject);
  document.getElementById('board-project-name').textContent = proj?.name ?? '';
}

// ════════════════════════════════════════════════════════════════════════
// Acciones de UI
// ════════════════════════════════════════════════════════════════════════
function selectProject(id) {
  state.currentProject = id;
  renderSidebar();
  loadTasks();
}

function addProject() {
  const name = prompt('Nombre del proyecto:');
  if (!name) return;
  const id = name.toLowerCase().replace(/\s+/g, '-');
  const colors = ['#c77dff','#4cc9f0','#f72585','#7bed9f'];
  state.projects.push({ id, name, color: colors[Math.floor(Math.random()*colors.length)] });
  selectProject(id);
}

function openNewTask() {
  document.getElementById('modal-title').textContent = 'Nueva Tarea';
  document.getElementById('t-taskid').value   = '';
  document.getElementById('t-title').value    = '';
  document.getElementById('t-desc').value     = '';
  document.getElementById('t-status').value   = 'PENDING';
  document.getElementById('t-priority').value = 'MEDIUM';
  document.getElementById('task-modal').classList.add('open');
}

function openEditTask(taskId) {
  const task = state.tasks.find(t => t.taskId === taskId);
  if (!task) return;
  document.getElementById('modal-title').textContent = 'Editar Tarea';
  document.getElementById('t-taskid').value   = task.taskId;
  document.getElementById('t-title').value    = task.title;
  document.getElementById('t-desc').value     = task.description ?? '';
  document.getElementById('t-status').value   = task.status;
  document.getElementById('t-priority').value = task.priority;
  document.getElementById('task-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('task-modal').classList.remove('open');
}

// ════════════════════════════════════════════════════════════════════════
// Bootstrap
// ════════════════════════════════════════════════════════════════════════
function startApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('user-chip').textContent = state.email;
  renderSidebar();
  loadTasks();
  connectWs();
}

// ════════════════════════════════════════════════════════════════════════
// Utilities
// ════════════════════════════════════════════════════════════════════════
function toggleAuth(view) {
  ['login-form','register-form','confirm-form'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
  document.getElementById(`${view}-form`).style.display = 'block';
  clearError();
}

function showError(msg) {
  const el = document.getElementById('error-box');
  el.textContent = msg; el.style.display = 'block';
}
function clearError() {
  document.getElementById('error-box').style.display = 'none';
}

function upsertTaskLocal(task) {
  const idx = state.tasks.findIndex(t => t.taskId === task.taskId);
  if (idx >= 0) state.tasks[idx] = task;
  else state.tasks.push(task);
}

function parseJwt(token) {
  try { return JSON.parse(atob(token.split('.')[1])); }
  catch { return {}; }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Cerrar modal al click fuera
document.getElementById('task-modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
</script>
